<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 Редактор розкладу PRO</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

  <style>
    :root {
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --bg: #111827;
      --card-bg: #1F2937;
      --text: #F9FAFB;
      --border: #374151;
      --input-bg: #374151;
      --danger: #EF4444;
      --success: #10B981;
      --accent: #F59E0B;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    /* Стилізація панелі інструментів */
    .toolbar {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    /* ФІКС ВІЗУАЛУ КНОПКИ ЗАВАНТАЖЕННЯ */
    .file-input-container {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .btn-upload-custom {
      background-color: var(--primary);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.2s;
      border: none;
    }

    .btn-upload-custom:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

    #fileInput {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    #dateEditorContainer {
      display: none; /* Показуємо тільки після завантаження */
      align-items: center;
      gap: 12px;
      background: rgba(245, 158, 11, 0.1);
      padding: 8px 15px;
      border-radius: 10px;
      border: 1px solid var(--accent);
    }

    .date-input-main {
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
      outline: none;
      width: 160px;
    }

    .btn-save {
      background-color: var(--success);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    /* Специфікація сітки */
    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      flex-grow: 1;
      overflow: hidden;
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .template-item {
      background: var(--input-bg);
      border: 1px dashed var(--border);
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      cursor: grab;
      font-size: 14px;
      transition: 0.2s;
    }
    .template-item:hover { border-color: var(--primary); background: #2D3748; }
    .template-block { border: 1px solid var(--primary); color: var(--primary); font-weight: bold; }

    .schedule-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      padding-right: 10px;
    }

    .day {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .day-title-input {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 18px;
      font-weight: bold;
      outline: none;
    }

    .lesson {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      background: var(--bg);
      padding: 10px;
      border-radius: 10px;
      align-items: center;
    }

    input[type="text"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .time-input { flex: 0.3; }
    .subject-input { flex: 1; }

    .btn-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 20px; }
    .btn-add-row { width: 100%; background: transparent; color: var(--text); border: 1px dashed var(--border); padding: 10px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .btn-add-row:hover { border-color: var(--primary); color: var(--primary); }

    .dragging { opacity: 0.4; }
    .drag-over { border-top: 3px solid var(--primary); }
  </style>
</head>
<body>

<div class="toolbar">
  <div class="file-input-container">
    <button class="btn-upload-custom">📥 Завантажити JSON</button>
    <input type="file" id="fileInput" accept=".json">
  </div>

  <div id="dateEditorContainer">
    <input type="text" id="weekDateInput" class="date-input-main" placeholder="ДАТИ НЕМАЄ">
  </div>
  
  <button id="saveBtn" class="btn-save" onclick="exportJSON()">📤 Зберегти</button>
</div>

<div class="container">
  <div class="sidebar">
    <h3 style="margin-top:0">Готові блоки</h3>
    <div class="template-item template-block" draggable="true" ondragstart="startDrag(event, 'block', 'virobniche', true)">⚙️ Виробниче навч. (6 ур.)</div>
    <div class="template-item template-block" draggable="true" ondragstart="startDrag(event, 'block', 'zahist', true)">🛡️ Захист України (6 ур.)</div>
    
    <h3 style="margin-top:25px">Предмети</h3>
    <div id="templates-list"></div>
  </div>

  <div class="schedule-area" id="app">
    <div style="text-align: center; color: #4B5563; margin-top: 100px;">
      <h2>Вітаємо!</h2>
      <p>Завантажте ваш JSON файл розкладу, щоб почати редагування.</p>
    </div>
  </div>
</div>

<script>
const standardTimes = ["(8:30 - 9:15)", "(9:25 - 10:10)", "(10:20 - 11:05)", "(11:25 - 12:10)", "(12:40 - 13:25)", "(13:35 - 14:20)", "(14:30 - 15:15)", "(15:25 - 16:10)"];
const subjectsTemplates = ["Спецтехнологія (Ауд 23)", "Математика (Ауд 32-2)", "Фізика і астрон. (Ауд 45-2)", "Фізична культура (Ауд С/М_1)", "Електрот.з осн. (Ауд 24)", "Українська мова (Ауд 43-2)", "Захист України (Ауд 9-2/17-2)", "Електроматеріал. (Ауд 33)", "Біологія і екол. (Ауд 8-2)", "Техн. креслення (Ауд 21)", "Електробезп. (Ауд 23)", "Хімія (Ауд 8-2)", "Заруб. літ. (Ауд 23-2)", "Географія (Ауд 3-2)", "Історія (Ауд 25-2)", "Іноземна мова (Ауд 23-2/44-2)", "Осн. підпр. дія (Ауд 43)"];
const blocks = {
  "virobniche": ["Виробниче навчання", "(8:00 - 8:45)", "Виробниче навчання", "(8:55 - 9:40)", "Виробниче навчання", "(9:50 - 10:35)", "Виробниче навчання", "(11:00 - 11:45)", "Виробниче навчання", "(11:55 - 12:40)", "Виробниче навчання", "(12:50 - 13:35)"],
  "zahist": ["Захист України (Ауд 9-2/17-2)", "(8:30 - 9:15)", "Захист України (Ауд 9-2/17-2)", "(9:25 - 10:10)", "Захист України (Ауд 9-2/17-2)", "(10:20 - 11:05)", "Захист України (Ауд 9-2/17-2)", "(11:25 - 12:10)", "Захист України (Ауд 9-2/17-2)", "(12:40 - 13:25)", "Захист України (Ауд 9-2/17-2)", "(13:35 - 14:20)"]
};

let rawData = null, dragItem = null, originalFileName = "schedule.json";

// Ініціалізація сайдбару
function initSidebar() {
  const list = document.getElementById("templates-list");
  subjectsTemplates.forEach(s => {
    const d = document.createElement("div");
    d.className = "template-item";
    d.innerText = s;
    d.draggable = true;
    d.ondragstart = (e) => startDrag(e, 'subject', s, true);
    list.appendChild(d);
  });
}

// Завантаження файлу
document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  originalFileName = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    rawData = JSON.parse(reader.result);
    document.getElementById("dateEditorContainer").style.display = "flex";
    document.getElementById("saveBtn").style.display = "block";
    render();
  };
  reader.readAsText(file);
});

function startDrag(e, type, payload, isCopy, day = null, index = null) {
  dragItem = { type, payload, isCopy, day, index };
  if (!isCopy) setTimeout(() => e.target.classList.add("dragging"), 0);
}

function handleDrop(e, targetDay) {
  e.preventDefault();
  document.querySelectorAll('.lesson').forEach(l => l.classList.remove('drag-over'));
  if (!dragItem || !rawData) return;

  let itemsToAdd = [];
  if (dragItem.type === 'subject') {
    itemsToAdd = [dragItem.payload, standardTimes[rawData.schedule[targetDay].length / 2] || "(00:00)"];
  } else if (dragItem.type === 'block') {
    itemsToAdd = [...blocks[dragItem.payload]];
  } else if (dragItem.type === 'lesson') {
    itemsToAdd = rawData.schedule[dragItem.day].splice(dragItem.index, 2);
  }

  const lessonNode = e.target.closest('.lesson');
  if (lessonNode) {
    let idx = parseInt(lessonNode.dataset.index);
    rawData.schedule[targetDay].splice(idx, 0, ...itemsToAdd);
  } else {
    rawData.schedule[targetDay].push(...itemsToAdd);
  }
  render();
}

function render() {
  const app = document.getElementById("app");
  if (!rawData) return;
  document.getElementById("weekDateInput").value = rawData.date || "";
  app.innerHTML = "";

  for (let day in rawData.schedule) {
    const dayDiv = document.createElement("div");
    dayDiv.className = "day";
    dayDiv.ondragover = (e) => e.preventDefault();
    dayDiv.ondrop = (e) => handleDrop(e, day);

    const header = document.createElement("div");
    header.className = "day-header";
    const title = document.createElement("input");
    title.className = "day-title-input";
    title.value = day;
    title.onchange = () => {
      rawData.schedule[title.value] = rawData.schedule[day];
      if(title.value !== day) delete rawData.schedule[day];
      render();
    };
    header.appendChild(title);
    dayDiv.appendChild(header);

    const lessons = rawData.schedule[day];
    for (let i = 0; i < lessons.length; i += 2) {
      const row = document.createElement("div");
      row.className = "lesson";
      row.draggable = true;
      row.dataset.index = i;
      row.ondragstart = (e) => startDrag(e, 'lesson', null, false, day, i);
      row.ondragover = (e) => { e.preventDefault(); row.classList.add('drag-over'); };
      row.ondragleave = () => row.classList.remove('drag-over');

      const subj = document.createElement("input");
      subj.className = "subject-input";
      subj.value = lessons[i];
      subj.oninput = () => lessons[i] = subj.value;

      const time = document.createElement("input");
      time.className = "time-input";
      time.value = lessons[i+1];
      time.oninput = () => lessons[i+1] = time.value;

      const del = document.createElement("button");
      del.className = "btn-delete";
      del.innerHTML = "×";
      del.onclick = () => { lessons.splice(i, 2); render(); };

      row.append(subj, time, del);
      dayDiv.appendChild(row);
    }

    const addBtn = document.createElement("button");
    addBtn.className = "btn-add-row";
    addBtn.innerText = "➕ Додати предмет";
    addBtn.onclick = () => {
      lessons.push("Новий предмет", standardTimes[lessons.length/2] || "(00:00)");
      render();
    };
    dayDiv.appendChild(addBtn);
    app.appendChild(dayDiv);
  }
}

function exportJSON() {
  rawData.date = document.getElementById("weekDateInput").value;
  const blob = new Blob([JSON.stringify(rawData, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = originalFileName;
  a.click();
}

initSidebar();
</script>

</body>
</html>
