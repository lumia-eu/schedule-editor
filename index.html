<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 Schedule-Editor</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">

  <style>
    :root {
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --bg: #111827;
      --card-bg: #1F2937;
      --text: #F9FAFB;
      --border: #374151;
      --input-bg: #111827;
      --danger: #EF4444;
      --success: #10B981;
      --accent: #F59E0B;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: clamp(10px, 3vw, 20px);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
    }

    .file-input-container { position: relative; display: inline-flex; }
    .btn-upload-custom {
      background-color: var(--primary);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      border: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #fileInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }

    #dateEditorContainer {
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(99, 102, 241, 0.1);
      padding: 8px 18px;
      border-radius: 12px;
      border: 1px solid var(--primary);
    }

    .date-input-main {
      border: none; background: transparent;
      font-size: 14px; font-weight: 600;
      color: var(--text); outline: none; width: 190px;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
      flex-grow: 1;
    }

    @media (max-width: 1100px) {
      .container { grid-template-columns: 1fr; }
      .sidebar { order: 2; }
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border);
      height: fit-content;
      position: sticky; top: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .schedule-area {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
      gap: 20px;
    }

    .day {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border);
    }

    .day-header {
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .day-title-input {
      background: transparent; border: none;
      color: var(--primary); font-size: 1.3rem;
      font-weight: 800; outline: none; width: 100%;
    }

    .lesson {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 12px;
      align-items: center;
      cursor: grab;
    }

    .subject-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .time-input {
      width: 135px;
      flex-shrink: 0;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: var(--accent);
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
    }

    .btn-delete { background: none; border: none; color: #6B7280; cursor: pointer; font-size: 1.3rem; }
    .btn-delete:hover { color: var(--danger); }

    .btn-add-row {
      width: 100%; background: transparent; color: #9CA3AF;
      border: 1px dashed var(--border); padding: 10px;
      border-radius: 12px; margin-top: 10px; cursor: pointer;
    }

    .btn-save {
      background-color: var(--success); color: white;
      border: none; padding: 12px 24px; border-radius: 12px;
      font-weight: 700; cursor: pointer; display: none; margin-left: auto;
    }

    .template-item {
      background: var(--input-bg); border: 1px dashed var(--border);
      padding: 10px; margin-bottom: 8px; border-radius: 10px;
      cursor: grab; font-size: 0.85rem; transition: 0.2s;
    }
    .template-item:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }

    h3 { margin-bottom: 15px; font-size: 1rem; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="file-input-container">
      <input type="file" id="fileInput" accept=".json">
      <button class="btn-upload-custom">📥 Завантажити JSON</button>
    </div>

    <div id="dateEditorContainer">
      <span>📅</span>
      <input type="text" id="weekDateInput" class="date-input-main" placeholder="Оберіть дати">
    </div>
    
    <button id="saveBtn" class="btn-save" onclick="exportJSON()">📤 Зберегти JSON</button>
  </div>

  <div class="container">
    <div class="sidebar">
      <h3>Швидкі блоки</h3>
      <div class="template-item" style="border: 1px solid var(--primary); color: var(--primary);" draggable="true" ondragstart="startDrag(event, 'block', 'vn')">⚙️ Виробниче навчання (Блок)</div>
      <div class="template-item" style="border: 1px solid var(--primary); color: var(--primary);" draggable="true" ondragstart="startDrag(event, 'block', 'zahist_block')">🛡️ Захист України (Блок)</div>
      
      <h3>Предмети</h3>
      <div id="templates-list"></div>
    </div>

    <div class="schedule-area" id="app">
      <div style="text-align: center; grid-column: 1/-1; padding: 100px 20px; opacity: 0.3;">
        <h2>Оберіть файл для початку</h2>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/uk.js"></script>

<script>
// Налаштування часу
const standardTimes = ["(8:30 - 9:15)", "(9:25 - 10:10)", "(10:20 - 11:05)", "(11:25 - 12:10)", "(12:40 - 13:25)", "(13:35 - 14:20)", "(14:30 - 15:15)", "(15:25 - 16:10)"];
const vnTimes = ["(8:00 - 8:45)", "(8:55 - 9:40)", "(9:50 - 10:35)", "(11:00 - 11:45)", "(11:55 - 12:40)", "(12:50 - 13:35)"];

const subjects = [
  "Спецтехнологія (Ауд 23)", "Математика (Ауд 32-2)", "Фізика і астрон. (Ауд 45-2)", 
  "Фізична культура (Ауд С/М_1)", "Електрот.з осн. (Ауд 24)", "Українська мова (Ауд 43-2)", 
  "Захист України (Ауд 9-2/17-2)", "Електроматеріал. (Ауд 33)", "Біологія і екол. (Ауд 8-2)", 
  "Техн. креслення (Ауд 21)", "Електробезп. (Ауд 23)", "Хімія (Ауд 8-2)", 
  "Заруб. літ. (Ауд 23-2)", "Географія (Ауд 3-2)", "Історія (Ауд 25-2)", 
  "Іноземна мова (Ауд 23-2/44-2)", "Осн. підпр. дія (Ауд 43)"
];

let rawData = null, dragItem = null, originalFileName = "schedule.json", fp = null;

function init() {
  const list = document.getElementById("templates-list");
  subjects.forEach(s => {
    const d = document.createElement("div");
    d.className = "template-item";
    d.innerText = s;
    d.draggable = true;
    d.ondragstart = (e) => dragItem = { type: 'subject', payload: s };
    list.appendChild(d);
  });

  fp = flatpickr("#weekDateInput", {
    mode: "range", dateFormat: "d.m.Y", locale: "uk",
    onClose: (s, str) => { if(rawData) rawData.date = str; }
  });
}

document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  originalFileName = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    let data = JSON.parse(reader.result);
    // Очищуємо час для динаміки
    for(let day in data.schedule) {
      data.schedule[day] = data.schedule[day].filter((_, i) => i % 2 === 0);
    }
    rawData = data;
    document.getElementById("dateEditorContainer").style.display = "flex";
    document.getElementById("saveBtn").style.display = "block";
    if (rawData.date) fp.setDate(rawData.date);
    render();
  };
  reader.readAsText(file);
});

function startDrag(e, type, payload, day = null, index = null) {
  dragItem = { type, payload, day, index };
}

function handleDrop(e, targetDay) {
  e.preventDefault();
  if (!dragItem || !rawData) return;

  let lessonsToAdd = [];
  if (dragItem.type === 'subject') {
    lessonsToAdd = [dragItem.payload];
  } else if (dragItem.type === 'block') {
    if (dragItem.payload === 'vn') {
      lessonsToAdd = Array(6).fill("Виробниче навчання");
    } else {
      lessonsToAdd = Array(6).fill("Захист України (Ауд 9-2/17-2)");
    }
  } else if (dragItem.type === 'lesson') {
    lessonsToAdd = rawData.schedule[dragItem.day].splice(dragItem.index, 1);
  }

  const lessonNode = e.target.closest('.lesson');
  if (lessonNode) {
    rawData.schedule[targetDay].splice(parseInt(lessonNode.dataset.index), 0, ...lessonsToAdd);
  } else {
    rawData.schedule[targetDay].push(...lessonsToAdd);
  }
  render();
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!rawData) return;

  for (let day in rawData.schedule) {
    const dayDiv = document.createElement("div");
    dayDiv.className = "day";
    dayDiv.ondragover = e => e.preventDefault();
    dayDiv.ondrop = e => handleDrop(e, day);

    dayDiv.innerHTML = `<div class="day-header"><input class="day-title-input" value="${day}" onchange="updateDay('${day}', this.value)"></div>`;

    rawData.schedule[day].forEach((text, i) => {
      const row = document.createElement("div");
      row.className = "lesson";
      row.draggable = true;
      row.dataset.index = i;
      row.ondragstart = () => startDrag(null, 'lesson', null, day, i);

      // ВИЗНАЧЕННЯ ЧАСУ: якщо урок "Виробниче навчання", беремо vnTimes, інакше standardTimes
      const isVN = text.includes("Виробниче навчання");
      const timeValue = isVN ? (vnTimes[i] || "(??:??)") : (standardTimes[i] || "(??:??)");

      row.innerHTML = `
        <input class="subject-input" value="${text}" oninput="rawData.schedule['${day}'][${i}]=this.value; if(this.value.includes('Виробниче')) render();">
        <input class="time-input" value="${timeValue}" readonly>
        <button class="btn-delete" onclick="rawData.schedule['${day}'].splice(${i},1);render()">×</button>
      `;
      dayDiv.appendChild(row);
    });

    const addBtn = document.createElement("button");
    addBtn.className = "btn-add-row";
    addBtn.innerText = "➕ Додати предмет";
    addBtn.onclick = () => { rawData.schedule[day].push("Новий предмет"); render(); };
    dayDiv.appendChild(addBtn);
    app.appendChild(dayDiv);
  }
}

function updateDay(oldN, newN) {
  rawData.schedule[newN] = rawData.schedule[oldN];
  delete rawData.schedule[oldN];
  render();
}

function exportJSON() {
  let exportData = JSON.parse(JSON.stringify(rawData));
  for(let day in exportData.schedule) {
    let formatted = [];
    exportData.schedule[day].forEach((subj, i) => {
      const isVN = subj.includes("Виробниче навчання");
      const time = isVN ? (vnTimes[i] || "(00:00)") : (standardTimes[i] || "(00:00)");
      formatted.push(subj, time);
    });
    exportData.schedule[day] = formatted;
  }
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = originalFileName;
  a.click();
}

init();
</script>
</body>
</html>
