<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 Schedule-Editor</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">

  <style>
    :root {
      --primary: #8b5cf6; /* Более сочный фиолетовый */
      --primary-hover: #7c3aed;
      --bg: #09090b; /* Строгий глубокий черный */
      --card-bg: #18181b;
      --text: #fafafa;
      --border: #27272a;
      --input-bg: #09090b;
      --danger: #f43f5e;
      --success: #10b981;
      --accent: #f59e0b;
      --glow: 0 0 15px rgba(139, 92, 246, 0.2);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: clamp(15px, 3vw, 30px);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .file-input-container { position: relative; display: inline-flex; }
    .btn-upload-custom {
      background-color: var(--primary);
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      border: none;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-upload-custom:hover {
      background-color: var(--primary-hover);
      box-shadow: var(--glow);
      transform: translateY(-1px);
    }
    #fileInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }

    #dateEditorContainer {
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(139, 92, 246, 0.1);
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--primary);
      transition: box-shadow 0.2s ease;
    }
    #dateEditorContainer:focus-within { box-shadow: var(--glow); }

    .date-input-main {
      border: none; background: transparent;
      font-size: 14px; font-weight: 600;
      color: var(--text); outline: none; width: 170px;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
      flex-grow: 1;
    }

    @media (max-width: 1100px) {
      .container { grid-template-columns: 1fr; }
      .sidebar { order: 2; position: static; }
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--border);
      height: fit-content;
      position: sticky; top: 20px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .schedule-area {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
      gap: 20px;
      align-content: start;
    }

    .day {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .day:hover { border-color: #3f3f46; }

    .day-header {
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .day-title-input {
      background: transparent; border: none;
      color: var(--primary); font-size: 1.2rem;
      font-weight: 700; outline: none; width: 100%;
    }

    .lesson {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      background: var(--input-bg);
      padding: 10px;
      border-radius: 10px;
      align-items: center;
      cursor: grab;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .lesson:hover { border-color: var(--border); }
    .lesson:active { cursor: grabbing; }

    .subject-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    .time-input {
      width: 110px;
      flex-shrink: 0;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: var(--accent);
      padding: 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      font-family: monospace;
    }

    .btn-delete { background: none; border: none; color: #52525b; cursor: pointer; font-size: 1.2rem; transition: color 0.2s; }
    .btn-delete:hover { color: var(--danger); }

    .btn-add-row {
      width: 100%; background: transparent; color: #71717a;
      border: 1px dashed var(--border); padding: 12px;
      border-radius: 10px; margin-top: 10px; cursor: pointer;
      font-weight: 600; transition: all 0.2s;
    }
    .btn-add-row:hover { border-color: var(--primary); color: var(--primary); background: rgba(139, 92, 246, 0.05); }

    .btn-save {
      background-color: var(--success); color: white;
      border: none; padding: 12px 24px; border-radius: 10px;
      font-weight: 600; cursor: pointer; display: none; margin-left: auto;
      transition: all 0.2s ease;
    }
    .btn-save:hover { background-color: #059669; transform: translateY(-1px); }

    .template-item {
      background: var(--input-bg); border: 1px solid var(--border);
      padding: 12px; margin-bottom: 8px; border-radius: 8px;
      cursor: grab; font-size: 0.85rem; transition: all 0.2s;
      font-weight: 500;
    }
    .template-item.block { border-color: var(--primary); color: var(--primary); background: rgba(139, 92, 246, 0.05); }
    .template-item:hover { border-color: var(--primary-hover); transform: translateX(2px); }

    h3 { margin-bottom: 15px; font-size: 0.85rem; color: #71717a; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;}
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="file-input-container">
      <input type="file" id="fileInput" accept=".json">
      <button class="btn-upload-custom">📥 Завантажити JSON</button>
    </div>

    <div id="dateEditorContainer">
      <span>📅</span>
      <input type="text" id="weekDateInput" class="date-input-main" placeholder="Оберіть дати">
    </div>
    
    <button id="saveBtn" class="btn-save" onclick="exportJSON()">📤 Зберегти JSON</button>
  </div>

  <div class="container">
    <div class="sidebar">
      <h3>Швидкі блоки</h3>
      <div id="blocks-list"></div>
      
      <h3 style="margin-top: 25px;">Предмети</h3>
      <div id="templates-list"></div>
    </div>

    <div class="schedule-area" id="app">
      <div style="text-align: center; grid-column: 1/-1; padding: 100px 20px; color: #52525b;">
        <h2>Оберіть файл для початку роботи</h2>
        <p style="font-size: 0.9rem; margin-top: 10px;">Або перетягніть сюди JSON файл</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/uk.js"></script>

<script>
let rawData = null, dragItem = null, originalFileName = "schedule.json", fp = null;
let config = { standardTimes: [], vnTimes: [], blocks: [], subjects: [] };

async function loadTemplates() {
  try {
    const response = await fetch('templates.json');
    if (!response.ok) throw new Error('Network response was not ok');
    config = await response.json();
    initSidebar();
  } catch (error) {
    console.error("Помилка завантаження templates.json:", error);
    document.getElementById("templates-list").innerHTML = "<p style='color: var(--danger); font-size: 0.8rem;'>Помилка завантаження templates.json. Відкрийте файл через локальний сервер (Live Server).</p>";
  }
}

function initSidebar() {
  const blocksList = document.getElementById("blocks-list");
  config.blocks.forEach(b => {
    const d = document.createElement("div");
    d.className = "template-item block";
    d.innerText = b.title;
    d.draggable = true;
    d.ondragstart = () => dragItem = { type: 'block', payload: b };
    blocksList.appendChild(d);
  });

  const subjList = document.getElementById("templates-list");
  config.subjects.forEach(s => {
    const d = document.createElement("div");
    d.className = "template-item";
    d.innerText = s;
    d.draggable = true;
    d.ondragstart = () => dragItem = { type: 'subject', payload: s };
    subjList.appendChild(d);
  });
}

function init() {
  loadTemplates();

  // Настройка формата даты dd.mm.yy
  fp = flatpickr("#weekDateInput", {
    mode: "range", 
    dateFormat: "d.m.y", 
    locale: "uk",
    onChange: (selectedDates, dateStr) => { 
      if(rawData) rawData.date = dateStr; 
    }
  });
}

document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  originalFileName = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    let data = JSON.parse(reader.result);
    // Очищаем время для динамики
    for(let day in data.schedule) {
      data.schedule[day] = data.schedule[day].filter((_, i) => i % 2 === 0);
    }
    rawData = data;
    
    document.getElementById("dateEditorContainer").style.display = "flex";
    document.getElementById("saveBtn").style.display = "block";
    
    // Автоматически подтягиваем дату из JSON, если она там есть
    if (rawData.date) {
        fp.setDate(rawData.date);
    }
    render();
  };
  reader.readAsText(file);
});

function startDrag(e, type, payload, day = null, index = null) {
  dragItem = { type, payload, day, index };
}

function handleDrop(e, targetDay) {
  e.preventDefault();
  if (!dragItem || !rawData) return;

  let lessonsToAdd = [];
  if (dragItem.type === 'subject') {
    lessonsToAdd = [dragItem.payload];
  } else if (dragItem.type === 'block') {
    lessonsToAdd = Array(dragItem.payload.count).fill(dragItem.payload.fill);
  } else if (dragItem.type === 'lesson') {
    lessonsToAdd = rawData.schedule[dragItem.day].splice(dragItem.index, 1);
  }

  const lessonNode = e.target.closest('.lesson');
  if (lessonNode) {
    rawData.schedule[targetDay].splice(parseInt(lessonNode.dataset.index), 0, ...lessonsToAdd);
  } else {
    rawData.schedule[targetDay].push(...lessonsToAdd);
  }
  render();
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!rawData) return;

  for (let day in rawData.schedule) {
    const dayDiv = document.createElement("div");
    dayDiv.className = "day";
    dayDiv.ondragover = e => e.preventDefault();
    dayDiv.ondrop = e => handleDrop(e, day);

    dayDiv.innerHTML = `<div class="day-header"><input class="day-title-input" value="${day}" onchange="updateDay('${day}', this.value)"></div>`;

    rawData.schedule[day].forEach((text, i) => {
      const row = document.createElement("div");
      row.className = "lesson";
      row.draggable = true;
      row.dataset.index = i;
      row.ondragstart = () => startDrag(null, 'lesson', null, day, i);

      const isVN = text.includes("Виробниче навчання");
      const timeValue = isVN ? (config.vnTimes[i] || "(??:??)") : (config.standardTimes[i] || "(??:??)");

      row.innerHTML = `
        <input class="subject-input" value="${text}" oninput="rawData.schedule['${day}'][${i}]=this.value; if(this.value.includes('Виробниче')) render();">
        <input class="time-input" value="${timeValue}" readonly>
        <button class="btn-delete" onclick="rawData.schedule['${day}'].splice(${i},1);render()">×</button>
      `;
      dayDiv.appendChild(row);
    });

    const addBtn = document.createElement("button");
    addBtn.className = "btn-add-row";
    addBtn.innerText = "+ Додати предмет";
    addBtn.onclick = () => { rawData.schedule[day].push("Новий предмет"); render(); };
    dayDiv.appendChild(addBtn);
    app.appendChild(dayDiv);
  }
}

function updateDay(oldN, newN) {
  rawData.schedule[newN] = rawData.schedule[oldN];
  delete rawData.schedule[oldN];
  render();
}

function exportJSON() {
  let exportData = JSON.parse(JSON.stringify(rawData));
  // Обновляем дату перед сохранением, берем актуальное значение из инпута Flatpickr
  exportData.date = document.getElementById("weekDateInput").value;
  
  for(let day in exportData.schedule) {
    let formatted = [];
    exportData.schedule[day].forEach((subj, i) => {
      const isVN = subj.includes("Виробниче навчання");
      const time = isVN ? (config.vnTimes[i] || "(00:00)") : (config.standardTimes[i] || "(00:00)");
      formatted.push(subj, time);
    });
    exportData.schedule[day] = formatted;
  }
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = originalFileName;
  a.click();
}

init();
</script>
</body>
</html>
