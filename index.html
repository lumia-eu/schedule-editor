<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 Schedule-Editor</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">

  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --bg: #09090b;
      --card-bg: #18181b;
      --text: #fafafa;
      --border: #27272a;
      --input-bg: #09090b;
      --danger: #f43f5e;
      --success: #10b981;
      --accent: #f59e0b;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: clamp(15px, 3vw, 30px);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; align-items: center;
      background: var(--card-bg); padding: 15px 20px; border-radius: 14px;
      border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .file-input-container { position: relative; display: inline-flex; }
    .btn-upload-custom {
      background-color: var(--primary); color: white; padding: 12px 24px;
      border-radius: 10px; font-weight: 600; border: none; display: flex;
      align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s;
    }
    .btn-upload-custom:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
    #fileInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }

    #dateEditorContainer {
      display: none; align-items: center; gap: 12px;
      background: rgba(139,92,246,0.1); padding: 10px 18px;
      border-radius: 10px; border: 1px solid var(--primary);
    }
    .date-input-main { border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text); outline: none; width: 220px; }

    .container { display: grid; grid-template-columns: 320px 1fr; gap: 25px; flex-grow: 1; }
    @media (max-width: 1100px) { .container { grid-template-columns: 1fr; } .sidebar { order: 2; } }

    .sidebar { background: var(--card-bg); border-radius: 14px; padding: 20px; border: 1px solid var(--border); height: fit-content; position: sticky; top: 20px; }

    .schedule-area { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 20px; }

    .day {
      background: var(--card-bg); border-radius: 14px; padding: 20px;
      border: 1px solid var(--border); transition: border-color 0.2s;
    }
    .day.drag-over-day {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary), 0 4px 24px rgba(139,92,246,0.15);
    }

    .day-header { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .day-title-input {
      background: transparent; border: none; color: var(--primary);
      font-size: 1.2rem; font-weight: 700; outline: none; width: 100%;
    }

    .lessons-list { min-height: 20px; position: relative; }

    .lesson {
      display: flex; gap: 10px; margin-bottom: 10px;
      background: var(--input-bg); padding: 10px; border-radius: 10px;
      align-items: center; cursor: grab; border: 1px solid transparent;
      transition: 
        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        margin-bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      position: relative;
    }
    .lesson:hover { border-color: var(--border); }

    .lesson.dragging {
      opacity: 0.25;
      transform: scale(0.92);
      height: 0 !important;
      margin-bottom: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .lesson.inserting {
      opacity: 0;
      transform: scale(0.85) translateY(12px);
      animation: lessonInsert 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes lessonInsert {
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .drop-indicator {
      height: 3px; border-radius: 2px; background: var(--primary);
      margin: -5px 0 7px; box-shadow: 0 0 8px rgba(139,92,246,0.6);
      pointer-events: none; animation: dropPulse 0.7s ease infinite alternate;
    }
    @keyframes dropPulse { from { opacity: 0.6; } to { opacity: 1; } }

    .drop-indicator-end {
      height: 3px; border-radius: 2px; background: var(--primary);
      margin-top: 8px; box-shadow: 0 0 8px rgba(139,92,246,0.6);
      pointer-events: none; animation: dropPulse 0.7s ease infinite alternate;
    }

    .drag-handle { color: #3f3f46; cursor: grab; font-size: 1rem; flex-shrink: 0; padding: 0 2px; transition: color 0.15s; }
    .lesson:hover .drag-handle { color: #71717a; }

    .subject-input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 0.9rem; outline: none; min-width: 0; }

    .time-input {
      flex-shrink: 0; width: 150px;
      background: linear-gradient(135deg, rgba(245,158,11,0.08) 0%, rgba(245,158,11,0.03) 100%);
      border: 1px solid rgba(245,158,11,0.25); color: var(--accent);
      padding: 8px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700;
      text-align: center; font-family: 'JetBrains Mono', monospace;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2); transition: all 0.2s ease;
      white-space: nowrap; overflow: hidden;
    }
    .time-input:hover { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.4); }

    .btn-delete { background: none; border: none; color: #52525b; cursor: pointer; font-size: 1.2rem; flex-shrink: 0; }
    .btn-delete:hover { color: var(--danger); }

    .btn-add-row {
      width: 100%; background: transparent; color: #71717a;
      border: 1px dashed var(--border); padding: 12px; border-radius: 10px;
      margin-top: 10px; cursor: pointer; font-weight: 600; transition: all 0.2s;
    }
    .btn-add-row:hover { border-color: var(--primary); color: var(--primary); }

    .btn-save {
      background-color: var(--success); color: white; border: none; padding: 12px 24px;
      border-radius: 10px; font-weight: 600; cursor: pointer; display: none; margin-left: auto;
    }

    .template-item {
      background: var(--input-bg); border: 1px solid var(--border);
      padding: 12px; margin-bottom: 8px; border-radius: 8px;
      cursor: grab; font-size: 0.85rem; transition: 0.2s;
    }
    .template-item.block { border-color: var(--primary); color: var(--primary); background: rgba(139,92,246,0.05); }
    .template-item:hover { border-color: var(--primary); transform: translateX(4px); }

    h3 { margin-bottom: 15px; font-size: 0.8rem; color: #71717a; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="file-input-container">
      <input type="file" id="fileInput" accept=".json">
      <button class="btn-upload-custom">📥 Завантажити JSON</button>
    </div>

    <div id="dateEditorContainer">
      <span>📅</span>
      <input type="text" id="weekDateInput" class="date-input-main" placeholder="Оберіть дати">
    </div>
    
    <button id="saveBtn" class="btn-save" onclick="exportJSON()">📤 Зберегти JSON</button>
  </div>

  <div class="container">
    <div class="sidebar">
      <h3>Швидкі блоки</h3>
      <div id="blocks-list"></div>
      
      <h3 style="margin-top: 25px;">Предмети</h3>
      <div id="templates-list"></div>
    </div>

    <div class="schedule-area" id="app">
      <div style="text-align: center; grid-column: 1/-1; padding: 100px 20px; opacity: 0.3;">
        <h2>Оберіть файл для початку</h2>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/uk.js"></script>

<script>
/* STATE */
let rawData = null, originalFileName = "schedule.json", fp = null;
let config = { standardTimes: [], vnTimes: [], blocks: [], subjects: [] };

const drag = {
  active: false,
  sourceDay: null,
  sourceIndex: null,
  type: null,        // 'lesson' | 'subject' | 'block'
  payload: null,
  el: null,
};

/* INIT */
async function loadTemplates() {
  try {
    const response = await fetch('templates.json');
    config = await response.json();
    initSidebar();
  } catch(e) { console.error("Templates loading error", e); }
}

function initSidebar() {
  const blocksList = document.getElementById("blocks-list");
  config.blocks.forEach(b => {
    const d = document.createElement("div");
    d.className = "template-item block";
    d.innerText = b.title;
    d.draggable = true;
    d.addEventListener('dragstart', () => {
      drag.type = 'block';
      drag.payload = b;
      drag.sourceDay = null;
      drag.sourceIndex = null;
    });
    blocksList.appendChild(d);
  });

  const subjList = document.getElementById("templates-list");
  config.subjects.forEach(s => {
    const d = document.createElement("div");
    d.className = "template-item";
    d.innerText = s;
    d.draggable = true;
    d.addEventListener('dragstart', () => {
      drag.type = 'subject';
      drag.payload = s;
      drag.sourceDay = null;
      drag.sourceIndex = null;
    });
    subjList.appendChild(d);
  });
}

function init() {
  loadTemplates();
  fp = flatpickr("#weekDateInput", { mode: "range", dateFormat: "d.m.Y", locale: "uk" });
}

/* FILE LOAD */
document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  originalFileName = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    let data = JSON.parse(reader.result);
    for (let day in data.schedule) {
      data.schedule[day] = data.schedule[day].filter((_, i) => i % 2 === 0);
    }
    rawData = data;
    document.getElementById("dateEditorContainer").style.display = "flex";
    document.getElementById("saveBtn").style.display = "block";
    if (rawData.date) fp.setDate(rawData.date.replace(/ - /g, ' to '));
    render();
  };
  reader.readAsText(file);
});

function getTime(text, index) {
  const isVN = text.includes("Виробниче навчання");
  return isVN ? (config.vnTimes[index] || "(??:??)") : (config.standardTimes[index] || "(??:??)");
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (!rawData) return;

  for (let day in rawData.schedule) {
    const dayDiv = document.createElement("div");
    dayDiv.className = "day";
    dayDiv.dataset.day = day;

    const header = document.createElement("div");
    header.className = "day-header";
    const titleInput = document.createElement("input");
    titleInput.className = "day-title-input";
    titleInput.value = day;
    titleInput.addEventListener('change', () => updateDay(day, titleInput.value));
    header.appendChild(titleInput);
    dayDiv.appendChild(header);

    const list = document.createElement("div");
    list.className = "lessons-list";
    list.dataset.day = day;

    rawData.schedule[day].forEach((text, i) => {
      list.appendChild(buildLessonEl(day, i, text));
    });

    list.addEventListener('dragover', onListDragOver);
    list.addEventListener('dragleave', onListDragLeave);
    list.addEventListener('drop', onListDrop);

    dayDiv.appendChild(list);

    const addBtn = document.createElement("button");
    addBtn.className = "btn-add-row";
    addBtn.innerText = "➕ Додати предмет";
    addBtn.addEventListener('click', () => {
      rawData.schedule[day].push("Новий предмет");
      render();
    });
    dayDiv.appendChild(addBtn);

    app.appendChild(dayDiv);
  }
}

function buildLessonEl(day, index, text) {
  const row = document.createElement("div");
  row.className = "lesson";
  row.draggable = true;
  row.dataset.day = day;
  row.dataset.index = index;

  const handle = document.createElement("span");
  handle.className = "drag-handle";
  handle.innerHTML = `<svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor">
    <circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/>
    <circle cx="3" cy="8" r="1.5"/><circle cx="9" cy="8" r="1.5"/>
    <circle cx="3" cy="13" r="1.5"/><circle cx="9" cy="13" r="1.5"/>
  </svg>`;
  row.appendChild(handle);

  const subjectInput = document.createElement("input");
  subjectInput.className = "subject-input";
  subjectInput.value = text;
  subjectInput.addEventListener('input', () => {
    rawData.schedule[day][index] = subjectInput.value;
    const newTime = getTime(subjectInput.value, index);
    const timeEl = row.querySelector('.time-input');
    if (timeEl) timeEl.value = newTime;
  });
  row.appendChild(subjectInput);

  const timeInput = document.createElement("input");
  timeInput.className = "time-input";
  timeInput.value = getTime(text, index);
  timeInput.readOnly = true;
  row.appendChild(timeInput);

  const delBtn = document.createElement("button");
  delBtn.className = "btn-delete";
  delBtn.innerHTML = "×";
  delBtn.addEventListener('click', () => {
    rawData.schedule[day].splice(index, 1);
    render();
  });
  row.appendChild(delBtn);

  row.addEventListener('dragstart', e => onLessonDragStart(e, row, day, index));
  row.addEventListener('dragend', onLessonDragEnd);

  return row;
}

/* DRAG & DROP */
function onLessonDragStart(e, el, day, index) {
  drag.active = true;
  drag.type = 'lesson';
  drag.sourceDay = day;
  drag.sourceIndex = index;
  drag.el = el;

  requestAnimationFrame(() => el.classList.add('dragging'));

  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
}

function onLessonDragEnd() {
  drag.active = false;
  if (drag.el) drag.el.classList.remove('dragging');
  drag.el = null;
  clearAllIndicators();
  clearDayHighlights();
}

function onListDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';

  const list = e.currentTarget;
  const dayEl = list.closest('.day');
  clearDayHighlights();
  dayEl.classList.add('drag-over-day');

  const { targetIndex } = getDropPosition(list, e.clientY);
  renderDropIndicator(list, targetIndex);
}

function onListDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    clearAllIndicators();
    clearDayHighlights();
  }
}

function onListDrop(e) {
  e.preventDefault();
  clearAllIndicators();
  clearDayHighlights();
  if (!drag.active && drag.type === null) return;

  const list = e.currentTarget;
  const targetDay = list.dataset.day;
  const { targetIndex } = getDropPosition(list, e.clientY);

  performDrop(targetDay, targetIndex);
}

function getDropPosition(list, clientY) {
  const lessonEls = [...list.querySelectorAll('.lesson:not(.dragging)')];
  if (lessonEls.length === 0) return { targetIndex: 0 };

  for (let i = 0; i < lessonEls.length; i++) {
    const rect = lessonEls[i].getBoundingClientRect();
    if (clientY < rect.top + rect.height * 0.5) {
      return { targetIndex: i };
    }
  }
  return { targetIndex: lessonEls.length };
}

function renderDropIndicator(list, targetIndex) {
  clearAllIndicators();
  const lessonEls = [...list.querySelectorAll('.lesson:not(.dragging)')];
  const indicator = document.createElement("div");
  indicator.className = "drop-indicator";
  indicator.dataset.indicator = "true";

  if (lessonEls.length === 0 || targetIndex >= lessonEls.length) {
    indicator.className = "drop-indicator-end";
    list.appendChild(indicator);
  } else {
    list.insertBefore(indicator, lessonEls[targetIndex]);
  }
}

function clearAllIndicators() {
  document.querySelectorAll('.drop-indicator, .drop-indicator-end').forEach(el => el.remove());
}

function clearDayHighlights() {
  document.querySelectorAll('.day.drag-over-day').forEach(el => el.classList.remove('drag-over-day'));
}

/* Головна функція drop — тепер підтримує ВСЕ */
function performDrop(targetDay, targetIndex) {
  if (!rawData) return;

  let itemsToInsert = [];

  if (drag.type === 'subject') {
    itemsToInsert = [drag.payload];
  } 
  else if (drag.type === 'block') {
    itemsToInsert = Array(drag.payload.count).fill(drag.payload.fill);
  } 
  else if (drag.type === 'lesson') {
    const srcDay = drag.sourceDay;
    const srcIndex = drag.sourceIndex;
    const [removed] = rawData.schedule[srcDay].splice(srcIndex, 1);
    itemsToInsert = [removed];
  }

  if (itemsToInsert.length === 0) return;

  const arr = rawData.schedule[targetDay];
  const insertAt = Math.max(0, Math.min(targetIndex, arr.length));
  arr.splice(insertAt, 0, ...itemsToInsert);

  render();

  // Плавна анімація появи нових елементів
  setTimeout(() => {
    const list = document.querySelector(`.lessons-list[data-day="${targetDay}"]`);
    if (!list) return;
    const lessons = [...list.querySelectorAll('.lesson')];
    for (let i = insertAt; i < insertAt + itemsToInsert.length && i < lessons.length; i++) {
      lessons[i].classList.add('inserting');
      setTimeout(() => lessons[i].classList.remove('inserting'), 450);
    }
  }, 20);
}

/* Інші функції */
function updateDay(oldN, newN) {
  if (oldN === newN) return;
  const entries = Object.entries(rawData.schedule);
  rawData.schedule = Object.fromEntries(entries.map(([k, v]) => [k === oldN ? newN : k, v]));
  render();
}

function exportJSON() {
  let exportData = JSON.parse(JSON.stringify(rawData));
  let dateVal = document.getElementById("weekDateInput").value;
  if (dateVal.includes(" to ")) {
    exportData.date = dateVal.split(" to ").map(d => {
      const parts = d.split('.');
      return `${parts[0]}.${parts[1]}.${parts[2].slice(-2)}`;
    }).join(" - ");
  } else if (dateVal) {
    const parts = dateVal.split('.');
    exportData.date = `${parts[0]}.${parts[1]}.${parts[2].slice(-2)}`;
  }

  for (let day in exportData.schedule) {
    let formatted = [];
    exportData.schedule[day].forEach((subj, i) => {
      formatted.push(subj, getTime(subj, i));
    });
    exportData.schedule[day] = formatted;
  }

  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = originalFileName;
  a.click();
}

init();
</script>
</body>
</html>
